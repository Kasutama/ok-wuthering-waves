name: Windows Release
run-name: Windows release · ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  PYTHON_VERSION: '3.12'
  PYTHONIOENCODING: 'UTF-8'
  PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'
  SIGN_BUILD: 'true'
  BUILD_EXE: 'true'
#  USE_RELEASE: 'https://api.github.com/repos/ok-oldking/ok-wuthering-waves/releases/tags/v3.5.15'

jobs:
  validate:
    name: 1 · Validate
    # 固定 windows-2022：2025 镜像 20260828.587 起 openvino 2026.3.0 在首次 OCR
    # 推理时原生崩溃（无 Python traceback，TestCD 等全部 OCR 测试受影响）。
    # 上游 20260819.586 镜像同样配置可通过；属 GitHub runner 镜像回归。
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "ok-oldking"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ".[dev]"

      - name: Prepare release requirements
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Run tests
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          CNB_TOKEN: ''
          OK_GH: ''
          SIGNPATH_API_TOKEN: ''
          GEMINI_API_KEY: ''
          AI_API_KEY: ''
          MirrorChyanUploadToken: ''
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
        run: |
          @(
            'GITHUB_TOKEN',
            'GH_TOKEN',
            'CNB_TOKEN',
            'OK_GH',
            'SIGNPATH_API_TOKEN',
            'GEMINI_API_KEY',
            'AI_API_KEY',
            'MirrorChyanUploadToken',
            'ACTIONS_RUNTIME_TOKEN',
            'ACTIONS_ID_TOKEN_REQUEST_TOKEN'
          ) | ForEach-Object {
            Remove-Item "Env:\$_" -ErrorAction SilentlyContinue
          }

          $failed = @()
          Get-ChildItem -Path ".\tests\*.py" | ForEach-Object {
            Write-Host "Running tests in $($_.FullName)"
            $proc = Start-Process -FilePath python -ArgumentList @('-m','unittest',$_.FullName) `
              -NoNewWindow -PassThru -RedirectStandardOutput "$env:TEMP\test_out.txt" -RedirectStandardError "$env:TEMP\test_err.txt"
            if (-not $proc.WaitForExit(600000)) {
              Write-Host "::error::TIMEOUT after 10min, killing: $($_.Name)"
              try { Stop-Process -Id $proc.Id -Force -ErrorAction Stop } catch { Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force }
              $failed += "$($_.Name) (timeout)"
              Get-Content "$env:TEMP\test_out.txt","$env:TEMP\test_err.txt" -ErrorAction SilentlyContinue | Select-Object -Last 30 | Write-Host
              return
            }
            Get-Content "$env:TEMP\test_out.txt","$env:TEMP\test_err.txt" -ErrorAction SilentlyContinue | Write-Host
            if ($proc.ExitCode -ne 0) {
              $failed += $_.Name
            }
          }
          if ($failed.Count -gt 0) {
            throw "Tests failed: $($failed -join ', ')"
          }

  package:
    name: 3 · Build and optionally sign
    needs: validate
    # 固定 windows-2022：windows-2025 镜像上 32 位 makensis 打 NSIS 安装包时报
    # "Internal compiler error #12345: error mmapping file ... out of range"（32 位地址空间问题）
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      SIGN_BUILD: 'false'

    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          # ok_templates 子模块含超长截图文件名，必须启用 git long paths
          git config --global core.longpaths true
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "ok-oldking"

      - name: Enable Windows long paths
        shell: pwsh
        run: |
          # 安装器内嵌 exe 也会做 git submodule 更新，系统级也开启长路径
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -Type DWord
          (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem').LongPathsEnabled

      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ".[dev]"

      - name: Prepare release requirements
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Reuse base executable
        id: reuse_executable
        uses: ok-oldking/pyappify-action@master
        if: env.BUILD_EXE == 'true' && env.USE_RELEASE != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          use_release: ${{ env.USE_RELEASE }}

      - name: Build portable executable
        id: build_executable
        uses: ok-oldking/pyappify-action@master
        if: env.BUILD_EXE == 'true' && env.USE_RELEASE == ''
        with:
          build_exe_only: ${{ env.SIGN_BUILD == 'true' }}

      - name: Upload portable executable for signing
        id: upload_executable
        uses: actions/upload-artifact@v4
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true' && env.USE_RELEASE == ''
        with:
          name: portable-executable-to-sign
          path: ${{ steps.build_executable.outputs.exe-path }}
          if-no-files-found: error
          retention-days: 1

      - name: Sign portable executable
        id: sign_executable
        uses: signpath/github-action-submit-signing-request@v2.2
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true' && env.USE_RELEASE == ''
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '639bc6dd-9623-43cd-ac75-50a445898012'
          project-slug: 'ok-wuthering-waves'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'single-exe'
          github-artifact-id: '${{ steps.upload_executable.outputs.artifact-id }}'
          wait-for-completion: false

      - name: Approve portable executable signing
        uses: fjogeleit/http-request-action@v1
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true' && env.USE_RELEASE == ''
        with:
          url: 'https://app.signpath.io/API/v1/639bc6dd-9623-43cd-ac75-50a445898012/SigningRequests/${{ steps.sign_executable.outputs.signing-request-id }}/Approve'
          method: POST
          bearerToken: '${{ secrets.SIGNPATH_API_TOKEN }}'
          contentType: application/json
          data: '{}'
          preventFailureOnNoResponse: true
          retry: 60
          retryWait: 10000

      - name: Download signed portable executable
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true' && env.USE_RELEASE == ''
        shell: pwsh
        env:
          SIGNING_REQUEST_ID: ${{ steps.sign_executable.outputs.signing-request-id }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          OUTPUT_DIRECTORY: ${{ steps.build_executable.outputs.exe-folder }}
        run: |
          $baseUrl = "https://app.signpath.io/API/v1/639bc6dd-9623-43cd-ac75-50a445898012/SigningRequests/$env:SIGNING_REQUEST_ID"
          $headers = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN" }
          $deadline = (Get-Date).AddSeconds(60000)

          do {
            $status = Invoke-RestMethod -Uri "$baseUrl/Status" -Headers $headers
            Write-Host "SignPath status: $($status.status) ($($status.workflowStatus))"

            if ($status.status -eq 'Completed') {
              break
            }

            if ($status.isFinalStatus) {
              throw "SignPath request ended with status '$($status.status)' ($($status.workflowStatus))."
            }

            if ((Get-Date) -ge $deadline) {
              throw 'Timed out waiting for SignPath to sign the portable executable.'
            }

            Start-Sleep -Seconds 10
          } while ($true)

          $archivePath = Join-Path $env:RUNNER_TEMP 'signed-portable-executable.zip'
          $outputDirectory = [System.IO.Path]::GetFullPath($env:OUTPUT_DIRECTORY)
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          Invoke-WebRequest -Uri "$baseUrl/SignedArtifact" -Headers $headers -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $outputDirectory -Force

      - name: Build installers
        id: build_installers
        uses: ok-oldking/pyappify-action@master
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true'

      - name: Upload China installer for signing
        id: upload_china_installer
        uses: actions/upload-artifact@v4
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true'
        with:
          name: china-installer-to-sign
          path: pyappify_dist/ok-ww-win32-China-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign China installer
        id: sign_china_installer
        uses: signpath/github-action-submit-signing-request@v2.2
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true'
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '639bc6dd-9623-43cd-ac75-50a445898012'
          project-slug: 'ok-wuthering-waves'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'setupexe'
          github-artifact-id: '${{ steps.upload_china_installer.outputs.artifact-id }}'
          wait-for-completion: false

      - name: Approve China installer signing
        uses: fjogeleit/http-request-action@v1
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true'
        with:
          url: 'https://app.signpath.io/API/v1/639bc6dd-9623-43cd-ac75-50a445898012/SigningRequests/${{ steps.sign_china_installer.outputs.signing-request-id }}/Approve'
          method: POST
          bearerToken: '${{ secrets.SIGNPATH_API_TOKEN }}'
          contentType: application/json
          data: '{}'
          preventFailureOnNoResponse: true
          retry: 60
          retryWait: 10000

      - name: Download signed China installer
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true'
        shell: pwsh
        env:
          SIGNING_REQUEST_ID: ${{ steps.sign_china_installer.outputs.signing-request-id }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $baseUrl = "https://app.signpath.io/API/v1/639bc6dd-9623-43cd-ac75-50a445898012/SigningRequests/$env:SIGNING_REQUEST_ID"
          $headers = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN" }
          $deadline = (Get-Date).AddSeconds(60000)

          do {
            $status = Invoke-RestMethod -Uri "$baseUrl/Status" -Headers $headers
            Write-Host "SignPath status: $($status.status) ($($status.workflowStatus))"

            if ($status.status -eq 'Completed') {
              break
            }

            if ($status.isFinalStatus) {
              throw "SignPath request ended with status '$($status.status)' ($($status.workflowStatus))."
            }

            if ((Get-Date) -ge $deadline) {
              throw 'Timed out waiting for SignPath to sign the China installer.'
            }

            Start-Sleep -Seconds 10
          } while ($true)

          $archivePath = Join-Path $env:RUNNER_TEMP 'signed-china-installer.zip'
          $outputDirectory = [System.IO.Path]::GetFullPath('pyappify_dist')
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          Invoke-WebRequest -Uri "$baseUrl/SignedArtifact" -Headers $headers -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $outputDirectory -Force

      - name: Stage release assets
        uses: actions/upload-artifact@v4
        if: env.BUILD_EXE == 'true'
        with:
          name: release-assets
          path: pyappify_dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 4 · Publish
    needs: [ package ]
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: pyappify_dist

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          ### 更新日志 $TAG:
            $TAG
          ### 下载包说明
            * [ok-ww-win32-China-setup.exe](https://github.com/ok-oldking/ok-wuthering-waves/releases/download/$TAG/ok-ww-win32-China-setup.exe) 完整安装包, 更新使用阿里云+腾讯CNB.
            * [ok-ww-win32-Global-setup.exe](https://github.com/ok-oldking/ok-wuthering-waves/releases/download/$TAG/ok-ww-win32-Global-setup.exe) full package with dependencies, using GitHub and PyPi as update source
            * 不要下载ok-ww-win32.zip,和SourceCode.zip, Do Not Download the SourceCode, ok-ww-win32.zip
          ### 如果无法下载或下载慢, 可以使用其他下载源
            * [Mirror酱下载渠道](https://mirrorchyan.com/zh/projects?rid=okww&source=ok-ww-release), 国内网页直链, 下载需要购买CD-KEY, 已有Mirror酱CD-KEY可免费下载
            * [百度网盘](https://pan.baidu.com/s/102Mh1djq2B1T-cIJhct9Gg?pwd=okww) 免费下载
            * [夸克网盘](https://pan.quark.cn/s/24433f3febc1) 免费下载
          EOF
          # 创建 Release（若已存在残留对象则忽略，后续 upload 会补齐资产）
          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" \
            --latest || echo "release create returned non-zero, assume it already exists"
          # 逐资产上传，每个最多重试 5 次，规避 GitHub 瞬时 500 / Error saving asset
          shopt -s nullglob
          for f in pyappify_dist/*; do
            ok=0
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --clobber; then
                echo "uploaded: $f"
                ok=1
                break
              fi
              echo "::warning::upload $f failed on attempt $attempt, retrying after backoff"
              sleep $((attempt * 20))
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::failed to upload asset after 5 attempts: $f"
              exit 1
            fi
          done

      - name: Trigger distribution workflows
        if: false
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_uploading
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release_note
